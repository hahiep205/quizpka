<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Chào mừng bạn!</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root{--k:.8;--bg:#f8fafc;--ink:#100f3e;--sub:#4b4b4b;--blob:#e6f5fe;--ring:#b3e5fc;--card:#fff;--bd:#e5e5e5;--blue:#1cb0f6;--blue-hover:#129bdc;--blue-shadow:#189cd8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%}body{display:flex;flex-direction:column;min-height:100vh;min-height:100dvh;background:var(--bg);color:var(--ink);font-family:"Nunito",system-ui,sans-serif;overflow-x:hidden}
    .page{position:relative;flex:1;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:24px 20px;max-width:1000px;margin:auto}.hero,.copy{position:relative;z-index:1}.hero{display:flex;flex-direction:column;align-items:center;gap:14px}.copy{text-align:center;max-width:460px;width:100%}
    .say{position:relative;max-width:340px;justify-content:center;background:var(--card);border:1px solid var(--bd);box-shadow:0 3px 0 var(--bd);border-radius:16px;padding:12px 18px;font-weight:800;font-size:18px;min-height:84px;display:flex;align-items:center;text-align:center}.say::after{content:"";position:absolute;left:50%;bottom:-9px;width:16px;height:16px;background:var(--card);border:solid var(--bd);border-width:0 1px 1px 0;transform:translateX(-50%) rotate(45deg)}
    .swap{animation:swap .45s cubic-bezier(.3,1.6,.5,1)}@keyframes swap{from{transform:scale(.85);opacity:.3}}
    .stage{position:relative;width:min(57.6vw,35.2vh,264px);aspect-ratio:1}.blob{position:absolute;inset:0;background:var(--blob);border-radius:50%;box-shadow:0 0 0 4px #cfeefd}.ring{position:absolute;inset:-20px;border:2px dashed var(--ring);border-radius:50%;animation:spin 40s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
    .stage svg{position:absolute;inset:0;width:100%;height:100%}.o{stroke:#263238;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}.w{fill:#fff}.eye{transform-box:fill-box;transform-origin:50% 50%;animation:blink 4s infinite}@keyframes blink{0%,91%,100%{transform:scaleY(1)}94%,96%{transform:scaleY(.07)}}#cat{transform-origin:100px 200px;animation:rise .9s cubic-bezier(.3,1.4,.5,1) .2s both}@keyframes rise{from{transform:translateY(60px) scale(.9);opacity:0}50%{opacity:1}}#cat.jump{animation:jump 1.4s cubic-bezier(.3,.8,.4,1)}@keyframes jump{0%{transform:scale(1.04,.94)}30%{transform:translateY(-26px) rotate(-3deg)}60%{transform:rotate(2deg) scale(1.03,.97)}100%{transform:none}}#catg{transform-origin:100px 200px;animation:breathe 3.6s ease-in-out infinite}@keyframes breathe{50%{transform:scale(1.015,1.025)}}
    .head{transform-origin:100px 150px;animation:look 9s ease-in-out infinite}@keyframes look{0%,12%,46%,52%,96%,100%{transform:none}20%,34%{transform:rotate(3deg) translateX(1.5px)}60%,72%{transform:rotate(-3.5deg) translateX(-1.5px)}80%,88%{transform:translateY(2px) rotate(1deg)}}.ear-l{transform-origin:60px 76px;animation:ear 4s infinite}.ear-r{transform-origin:140px 76px;animation:ear 5.5s infinite}@keyframes ear{0%,76%,100%{transform:none}84%{transform:rotate(9deg)}90%{transform:rotate(-5deg)}}.paw{animation:knead 1.8s ease-in-out infinite}.paw-r{animation-delay:.9s}@keyframes knead{50%{transform:translateY(-3px)}}
    h1{font-size:clamp(26px,5vw,32px);line-height:1.2;font-weight:900;margin:0 0 24px}.copy p{margin:0 0 24px;color:var(--sub);font-size:17px;font-weight:700;line-height:1.5}.btns{padding-top:24px;margin-bottom:4px;display:flex;flex-direction:column;align-items:center;gap:12px}.btn{display:inline-flex;align-items:center;justify-content:center;height:calc(48px*var(--k));min-width:calc(168px*var(--k));padding:0 calc(24px*var(--k));border:0;border-radius:calc(12px*var(--k));color:#fff;background:var(--blue);box-shadow:0 calc(4px*var(--k)) 0 var(--blue-shadow);font:700 calc(15px*var(--k))/1 "Nunito",system-ui,sans-serif;letter-spacing:.3px;text-transform:uppercase;white-space:nowrap;text-decoration:none;cursor:pointer;transition:transform .1s,filter .1s,box-shadow .1s}.btn:hover{background:var(--blue-hover)}.btn:active{transform:translateY(calc(4px*var(--k)));box-shadow:none}
    .cf{position:fixed;width:10px;height:14px;border-radius:3px;pointer-events:none;z-index:9}.ht{position:fixed;color:#ff4b4b;font-size:26px;font-weight:900;pointer-events:none;z-index:9}
    @media(max-width:480px){.page{gap:16px;padding:16px}.say{font-size:16px;min-height:76px;max-width:300px}.copy{max-width:100%}}@media(min-width:768px){:root{--k:.76}.btns{padding-top:32px}.page{gap:28px}.stage{width:min(42.5vw,35vh,304px)}.say{font-size:21px;max-width:440px;min-height:96px}.copy{max-width:460px}.copy p{font-size:19px}}@media(min-width:1100px){.btns{padding-top:40px}.page{gap:32px}.stage{width:min(25.8vw,38vh,350px)}.say{font-size:24px;max-width:500px;min-height:104px}.copy{max-width:480px}}@media(orientation:landscape) and (max-height:520px){.page{flex-direction:row;flex-wrap:wrap;gap:24px 40px;padding:12px 24px}.hero{flex-direction:row;gap:24px}.stage{width:min(32vh,160px)}.say{font-size:15px;min-height:64px;max-width:260px}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
</head>
<body>
  <main class="page">
    <section class="hero">
      <div class="say" id="say">Chào mừng đến với Quizpka!</div>
      <div class="stage" id="stage">
        <div class="blob"></div><div class="ring"></div>
        <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Khuôn mặt chú mèo trắng đang nhìn xung quanh">
          <defs><clipPath id="cc"><circle cx="100" cy="100" r="100"/></clipPath><path id="hp" d="M40 104C38 66 64 48 100 48C136 48 162 66 160 104C158 132 132 148 100 148C68 148 42 132 40 104Z"/><clipPath id="hc"><use href="#hp"/></clipPath></defs>
          <g clip-path="url(#cc)"><g id="cat"><g id="catg">
            <path class="o w" d="M42 205C42 160 62 138 100 138C138 138 158 160 158 205V290H42Z"/><path class="o" fill="#1cb0f6" d="M64 143Q100 166 136 143L133 156Q100 180 67 156Z"/><circle class="o" cx="100" cy="171" r="7" fill="#ffc800"/><path d="M96.5 171h7" stroke="#263238" stroke-width="2" stroke-linecap="round"/>
            <g class="head"><g class="ear-l"><path class="o w" d="M44 86L46 30Q47 23 54 26L96 52Z"/><path d="M53 72L54 41L78 56Z" fill="#263238" stroke="#263238" stroke-width="4" stroke-linejoin="round"/></g><g class="ear-r"><path class="o w" d="M156 86L154 30Q153 23 146 26L104 52Z"/><path d="M147 72L146 41L122 56Z" fill="#263238" stroke="#263238" stroke-width="4" stroke-linejoin="round"/></g>
              <use href="#hp" class="o w"/><ellipse cx="136" cy="84" rx="30" ry="36" transform="rotate(20 136 84)" fill="#263238" clip-path="url(#hc)"/><use href="#hp" class="o" fill="none"/>
              <g><ellipse cx="60" cy="123" rx="8" ry="5" fill="#ff9bb0" opacity=".6"/><ellipse cx="140" cy="123" rx="8" ry="5" fill="#ff9bb0" opacity=".6"/><g class="eye"><ellipse class="o w" cx="76" cy="100" rx="13" ry="15"/><circle cx="76" cy="101" r="7" fill="#263238"/><circle cx="78.6" cy="97.6" r="2.5" fill="#fff"/></g><g class="eye"><ellipse class="o w" cx="124" cy="100" rx="13" ry="15"/><circle cx="124" cy="101" r="7" fill="#263238"/><circle cx="126.6" cy="97.6" r="2.5" fill="#fff"/></g><path class="o" fill="#1cb0f6" d="M92.5 109Q100 105 107.5 109Q104 118 100 118Q96 118 92.5 109Z"/><path class="o" fill="none" d="M100 118V122M100 122Q94 130 87 124M100 122Q106 130 113 124"/><path class="o" fill="none" stroke-width="2" d="M54 112L28 106M54 118L26 120M56 124L32 134M146 112L172 106M146 118L174 120M144 124L168 134"/></g>
            </g><g class="paw"><ellipse class="o w" cx="73" cy="183" rx="18" ry="14"/><path class="o" fill="none" stroke-width="2" d="M67 180v8M73 179v9M79 180v8"/></g><g class="paw paw-r"><ellipse class="o w" cx="127" cy="183" rx="18" ry="14"/><path class="o" fill="none" stroke-width="2" d="M121 180v8M127 179v9M133 180v8"/></g>
          </g></g></g>
        </svg>
      </div>
    </section>
    <section class="copy"><div class="btns"><a class="btn" id="go" style="--d:1.2s" href="#">Bắt đầu nào</a></div></section>
  </main>
  <script>
    (()=>{const $=s=>document.querySelector(s),cat=$('#cat'),bub=$('#say'),st=$('#stage');const msgs=['Chào mừng đến với Quizpka!','Nền tảng ôn tập và luyện thi qua Quiz dành cho sinh viên Phenikaa.','Ấn vào nút bên dưới để bắt đầu ôn ngay'];let i=0;const say=t=>{bub.classList.remove('swap');void bub.offsetWidth;bub.textContent=t;bub.classList.add('swap')};setInterval(()=>say(msgs[++i%msgs.length]),4500);
    const fly=(e,k)=>e.animate(k.f,{duration:k.d,easing:'cubic-bezier(.2,.7,.3,1)'}).onfinish=()=>e.remove();const burst=()=>{const r=st.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height*.4,C=['#1cb0f6','#7dd3fc','#b3e5fc','#100f3e','#ffc800'];for(let k=0;k<24;k++){const e=document.createElement('b'),a=Math.random()*6.28,d=80+Math.random()*120,x=Math.cos(a)*d,y=Math.sin(a)*d;e.className='cf';e.style.cssText=`left:${cx}px;top:${cy}px;background:${C[k%5]};${k%3?'':'border-radius:50%;'}`;document.body.appendChild(e);fly(e,{d:1100+Math.random()*500,f:[{transform:'translate(0,0)',opacity:1},{transform:`translate(${x}px,${y-60}px) rotate(${Math.random()*500}deg)`,opacity:1,offset:.55},{transform:`translate(${x*1.1}px,${y+100}px) rotate(720deg)`,opacity:0}]})}for(let k=0;k<5;k++){const e=document.createElement('span');e.className='ht';e.textContent='♥';e.style.cssText=`left:${cx+(k-2)*22}px;top:${cy-30}px`;document.body.appendChild(e);fly(e,{d:1200+k*120,f:[{transform:'translate(0,0) scale(.4)',opacity:0},{transform:'translate(0,-30px) scale(1)',opacity:1,offset:.2},{transform:`translate(${(k-2)*10}px,-130px) scale(1.2)`,opacity:0}]})}};
    const hit=()=>{if(window.parent!==window)window.parent.postMessage({type:'quizpka-welcome-complete'},window.location.origin);st.classList.add('look');cat.classList.remove('jump');void cat.parentNode.getBoundingClientRect();cat.classList.add('jump');say(msgs[++i%msgs.length]);burst()};$('#go').addEventListener('click',e=>{e.preventDefault();hit()});let tm;const cl=v=>Math.max(-1,Math.min(1,v));addEventListener('pointermove',e=>{const r=st.getBoundingClientRect();st.style.setProperty('--dx',cl((e.clientX-r.left-r.width/2)/(innerWidth/2)));st.style.setProperty('--dy',cl((e.clientY-r.top-r.height/2)/(innerHeight/2)));st.classList.add('track');clearTimeout(tm);tm=setTimeout(()=>st.classList.remove('track'),2500)});})();
  </script>
</body>
</html>
