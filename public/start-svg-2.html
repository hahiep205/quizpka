<!DOCTYPE html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Start SVG Animation</title><style>
:root{--bg:#f4faff;--fg:#263238;--btn:#1CB0F6;--btn2:#fff;--bd:#cfe9f8}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#10222d;--fg:#e6f4fb;--btn2:#17313f;--bd:#27495c}}
:root[data-theme=dark]{--bg:#10222d;--fg:#e6f4fb;--btn2:#17313f;--bd:#27495c}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:"Nunito",system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:env(safe-area-inset-top,0) 16px env(safe-area-inset-bottom,0)}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
svg#hero{width:min(100%,640px);height:auto;max-height:92vh;overflow:visible}

.m-top,.m-eye,.m-brow,.rk-flame,.rk-smoke>g,.m-btn,.star{transform-box:fill-box}
.star{transform-origin:50% 50%;animation:tw 2.6s ease-in-out infinite;opacity:0}
.star:nth-of-type(2){animation-delay:.7s}.star:nth-of-type(3){animation-delay:1.4s}.star:nth-of-type(4){animation-delay:2s}
@keyframes tw{0%,100%{opacity:0;scale:.3}50%{opacity:1;scale:1}}
.m-top{transform-origin:50% 100%;animation:breathe 4s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1,1.008)}}
.m-arm,.m-head{transform-box:view-box}
.m-arm{transform-origin:430px 205px;animation:wave 1.3s ease-in-out infinite alternate}
@keyframes wave{from{transform:rotate(-6deg)}to{transform:rotate(6deg)}}
.m-head{transform-origin:382px 212px;animation:nod 6s ease-in-out infinite}
@keyframes nod{0%,100%{transform:rotate(0)}30%{transform:rotate(-3deg) translateY(.5px)}65%{transform:rotate(2.5deg)}}
.m-eye{transform-origin:50% 50%;animation:blink 4.2s infinite}
@keyframes blink{0%,86%,92.5%,100%{transform:scaleY(1)}88.5%,89.5%{transform:scaleY(.06)}95%,96%{transform:scaleY(.06)}}
.m-brow{animation:brow 6s ease-in-out infinite}
@keyframes brow{0%,60%,100%{transform:translateY(0)}68%,78%{transform:translateY(-1.6px)}}
.rk-body,.rk-flame{animation:lift 2.8s ease-in-out infinite}
@keyframes lift{50%{translate:0 -3.5px}}
.rk-body{animation:lift 2.8s ease-in-out infinite,shake .16s linear infinite}
@keyframes shake{0%{transform:translate(0,0)}25%{transform:translate(.3px,-.2px)}50%{transform:translate(-.25px,.25px)}75%{transform:translate(.2px,.2px)}}
.rk-flame{transform-origin:50% 0;animation:lift 2.8s ease-in-out infinite,flick .2s ease-in-out infinite alternate}
@keyframes flick{from{scale:1 .92}to{scale:1.04 1.12}}
.rk-smoke>g{transform-origin:50% 50%;animation:puff 3.4s ease-in-out infinite}
.rk-smoke>g:nth-child(3n){animation-delay:-.8s}.rk-smoke>g:nth-child(3n+1){animation-delay:-1.7s}.rk-smoke>g:nth-child(5n){animation-delay:-2.5s}
@keyframes puff{50%{scale:1.07}}
.m-btn{transform-origin:50% 50%;animation:btn 1.7s ease-in-out infinite}
@keyframes btn{50%{scale:1.04}}
@media (prefers-reduced-motion:reduce){svg *{animation:none!important}}
